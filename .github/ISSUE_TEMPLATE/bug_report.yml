name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **do not paste real transcripts, paths or secrets** — Trailwarden's whole point is that they stay on your machine. A redacted export (`trailwarden export --md`) or a made-up example is enough.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `trailwarden --version`, or Trailwarden → About.
      placeholder: "0.2.2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options: [Homebrew cask, Homebrew formula, DMG, npm, From source]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.2, Apple Silicon"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved
      multiple: true
      options: [Claude Code, Codex, Gemini CLI, opencode, Cursor, GitHub Copilot, Hermes, Not agent-specific]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "`trailwarden doctor` output helps (it lists folders and counts, not contents)."
