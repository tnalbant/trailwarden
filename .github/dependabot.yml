# Trailwarden has one Swift dependency (swift-argument-parser) and a handful of
# GitHub Actions. Both are checked weekly; updates arrive as pull requests.

version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
