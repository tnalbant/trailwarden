name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      # Formatting is a machine decision; keep it out of review comments.
      - name: Format check
        run: |
          brew install swiftformat
          swiftformat --lint .

      - name: Lint
        run: |
          brew install swiftlint
          swiftlint lint --quiet --strict

      # Trailwarden goes online only when the reader asks for an update check.
      # See THREATMODEL.md: one file may name a network API, and only that one.
      - name: No network APIs outside the update check
        run: |
          set -euo pipefail
          allowed='Sources/TrailwardenApp/Update/UpdateChecker.swift'
          strays=$(grep -RInE 'URLSession|NSURLConnection|URLRequest|CFNetwork|import Network' Sources/ \
            | grep -v "^$allowed:" || true)
          if [ -n "$strays" ]; then
            echo "::error::Network API outside $allowed — Trailwarden stays offline."
            echo "$strays"
            exit 1
          fi
          if ! grep -q 'URLSession' "$allowed"; then
            echo "::error::$allowed no longer contains the update check; update this rule and THREATMODEL.md."
            exit 1
          fi
          echo "OK: network APIs confined to the update check."

      # Interface text lives in the string catalog, never inline in views.
      - name: No hardcoded interface text
        run: |
          set -euo pipefail
          strays=$(grep -RnE '\b(Text|Button|Toggle)\("[^"\\]*[A-Za-z]{2,}' Sources/TrailwardenApp \
            | grep -vF 'Text("Trailwarden")' || true)
          # A ternary that returns a bare word is how a stray "0 olay" hid (SF Symbol names are fine).
          ternaries=$(grep -RnE '\? "[a-z0-9 ]*[a-z]{3,}[a-z0-9 ]*"' Sources/TrailwardenApp \
            | grep -vE 'system(Name|Image): ' || true)
          strays="$strays$ternaries"
          if [ -n "$strays" ]; then
            echo "::error::Hardcoded interface text; use the string catalog."
            echo "$strays"
            exit 1
          fi
          echo "OK: no hardcoded interface text."

      # Text is set in named roles (Tokens.Typography.font) so the Text size
      # setting reaches all of it; a literal point size would skip it.
      - name: No literal font sizes
        run: |
          set -euo pipefail
          strays=$(grep -RnE 'Typography\.(text|mono|serif)\(' Sources/TrailwardenApp || true)
          if [ -n "$strays" ]; then
            echo "::error::Literal font size; use Tokens.Typography.font(_:) with a text role."
            echo "$strays"
            exit 1
          fi
          echo "OK: no literal font sizes."

      # Real agent transcripts must never be committed; only synthetic fixtures.
      - name: No .jsonl outside fixtures
        run: |
          set -euo pipefail
          strays=$(find . -name '*.jsonl' -not -path './Tests/TrailwardenCoreTests/Fixtures/*' \
            -not -path './.build/*' -not -path './.git/*' -print -quit)
          if [ -n "$strays" ]; then
            echo "::error::Unexpected transcript file in the repo: $strays"
            exit 1
          fi
          echo "OK: no stray .jsonl files."

  app-build:
    name: App build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild -project Trailwarden.xcodeproj -scheme Trailwarden -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build | tail -n 200

  # Every commit on every branch, with the repository's own allowlist
  # (.gitleaks.toml, .gitleaksignore). A pinned release, checked against its
  # published checksum before it runs.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          file=gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$file"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $file" | sha256sum -c -
          tar -xzf "$file" gitleaks
          rm "$file"

      - name: Scan the whole history
        run: ./gitleaks git --log-opts=--all --no-banner --redact --exit-code 1 .
