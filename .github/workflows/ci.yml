name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      # Formatting is a machine decision; keep it out of review comments.
      - name: Format check
        run: |
          brew install swiftformat
          swiftformat --lint .

      - name: Lint
        run: |
          brew install swiftlint
          swiftlint lint --quiet --strict

      # Trailwarden goes online only when the reader asks for an update check.
      # See THREATMODEL.md: one file may name a network API, and only that one.
      - name: No network APIs outside the update check
        run: |
          set -euo pipefail
          allowed='Sources/TrailwardenApp/Update/UpdateChecker.swift'
          strays=$(grep -RInE 'URLSession|NSURLConnection|URLRequest|CFNetwork|import Network' Sources/ \
            | grep -v "^$allowed:" || true)
          if [ -n "$strays" ]; then
            echo "::error::Network API outside $allowed — Trailwarden stays offline."
            echo "$strays"
            exit 1
          fi
          if ! grep -q 'URLSession' "$allowed"; then
            echo "::error::$allowed no longer contains the update check; update this rule and THREATMODEL.md."
            exit 1
          fi
          echo "OK: network APIs confined to the update check."

      # Real agent transcripts must never be committed; only synthetic fixtures.
      - name: No .jsonl outside fixtures
        run: |
          set -euo pipefail
          strays=$(find . -name '*.jsonl' -not -path './Tests/TrailwardenCoreTests/Fixtures/*' \
            -not -path './.build/*' -not -path './.git/*' -print -quit)
          if [ -n "$strays" ]; then
            echo "::error::Unexpected transcript file in the repo: $strays"
            exit 1
          fi
          echo "OK: no stray .jsonl files."
