#
# XcodeGen spec for the menu-bar app. The Core/CLI/MCP targets live in
# Package.swift; the app consumes Core through the local Swift package.
# Regenerate with: xcodegen generate

name: Trailwarden
options:
  bundleIdPrefix: app.trailwarden
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "3"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  TrailwardenPackage:
    path: .

targets:
  Trailwarden:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/TrailwardenApp
    dependencies:
      - package: TrailwardenPackage
        product: TrailwardenCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.trailwarden
        PRODUCT_NAME: Trailwarden
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (c) 2026 Turgay Nalbant. Apache-2.0."
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      gatherCoverageData: false
